<!-- ARCHIVE: galería a pantalla completa, una imagen a la vez -->
<section id="archive" class="view">
  <span class="count" id="ac">00 / 00</span>
  <figure id="stage"><img id="aimg" alt=""></figure>
  <button class="step l" id="prev">PREV</button>
  <button class="step r" id="next">NEXT</button>
  <p class="msg" id="amsg"></p>
</section>

<!-- STATEMENT: cada línea se estira al ancho de la referencia (data-w = % del ancho de pantalla) -->

  <h1><span class="ln" data-w="95.3">We sculpt the reverse</span><span class="ln" data-w="95.6">of the irreversible fruit</span><span class="ln" data-w="92.7">so that the structure</span><span class="ln" data-w="52.8">may survive</span><span class="ln" data-w="22">time.</span></h1>

  <a class="tag" href="#home">Real needn’t<br>be perfect.</a>
</section>
